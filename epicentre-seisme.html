<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulation Sismique - Mode Analyse</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --p-wave: #2ecc71;
            --s-wave: #e74c3c;
            --delta: #f1c40f;
            --text: #c9d1d9;
            --grid: #30363d;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; box-sizing: border-box; overflow: hidden;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px; width: 100%; max-width: 1400px;
            flex-grow: 1; min-height: 0;
        }

        .map-box {
            background: var(--card);
            padding: 5px; border-radius: 12px; border: 1px solid var(--grid);
            display: flex; flex-direction: column; overflow: hidden;
            position: relative;
        }

        .speed-info {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(22, 27, 34, 0.9);
            padding: 10px; border-radius: 8px;
            border: 1px solid var(--grid);
            font-size: 12px; z-index: 20;
            backdrop-filter: blur(4px);
        }

        #map-canvas { width: 100%; height: 100%; background: #1c2128; border-radius: 8px; }

        .sismo-panel { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .sismo-card { background: var(--card); padding: 10px; border-radius: 10px; border: 1px solid var(--grid); }
        .sismo-header { font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #8b949e; }
        
        .view-port {
            position: relative; height: 120px; background: #010409;
            border-radius: 4px; overflow: hidden; border: 1px solid var(--grid);
        }

        .arrival-label {
            position: absolute; top: 5px; font-size: 11px; font-weight: bold;
            padding: 2px 4px; border-radius: 3px; background: rgba(0,0,0,0.8);
            transform: translateX(-50%); z-index: 10;
        }

        .dt-box {
            position: absolute; bottom: 0; height: 24px;
            background: rgba(241, 196, 15, 0.1); border-left: 2px solid var(--delta);
            border-right: 2px solid var(--delta); color: var(--delta);
            font-size: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; opacity: 0;
        }

        .controls { margin: 15px 0; display: flex; gap: 15px; }
        button { padding: 10px 25px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-run { background: #238636; color: white; }
        .btn-reset { background: #30363d; color: white; }
        .legend { display: flex; gap: 20px; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <h2 style="margin: 0 0 10px 0;">Simulation Sismique - Analyse des Délais</h2>
    
    <div class="legend">
        <span><b style="color:var(--p-wave)">P</b> : Ondes Primaires</span>
        <span><b style="color:var(--s-wave)">S</b> : Ondes Secondaires</span>
    </div>

    <div class="dashboard">
        <div class="map-box">
            <div class="speed-info">
                <div style="margin-bottom:4px;"><span style="color:var(--p-wave)">Vitesse P :</span> 6.0 km/s</div>
                <div><span style="color:var(--s-wave)">Vitesse S :</span> 3.4 km/s</div>
            </div>
            <canvas id="map-canvas"></canvas>
        </div>

        <div class="sismo-panel">
            <div class="sismo-card">
                <div class="sismo-header">STATION ALPHA</div>
                <div class="view-port"><canvas id="graph-0"></canvas><div id="dt-0" class="dt-box"></div></div>
            </div>
            <div class="sismo-card">
                <div class="sismo-header">STATION BETA</div>
                <div class="view-port"><canvas id="graph-1"></canvas><div id="dt-1" class="dt-box"></div></div>
            </div>
            <div class="sismo-card">
                <div class="sismo-header">STATION GAMMA</div>
                <div class="view-port"><canvas id="graph-2"></canvas><div id="dt-2" class="dt-box"></div></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-run" onclick="start()">LANCER LE SÉISME</button>
        <button class="btn-reset" onclick="reset(true)">NOUVEL ÉPICENTRE</button>
    </div>

    <script>
        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');
        const mapImg = new Image();
        mapImg.src = 'fond_carte_seisme.avif'; 

        let epicentre = { x: 0, y: 0 };
        let stations = [];
        let time = 0;
        let active = false;
        let raf;

        function init() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            stations = [
                { x: canvas.width * 0.5, y: canvas.height * 0.2, name: "Alpha" },
                { x: canvas.width * 0.8, y: canvas.height * 0.7, name: "Beta" },
                { x: canvas.width * 0.2, y: canvas.height * 0.8, name: "Gamma" }
            ];
            reset(true);
        }

        function drawMap() {
            ctx.fillStyle = '#1c2128';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (mapImg.complete && mapImg.naturalWidth !== 0) {
                ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);
            }
            stations.forEach(s => {
                ctx.fillStyle = "white"; ctx.strokeStyle = "black";
                ctx.beginPath(); ctx.moveTo(s.x, s.y-10); ctx.lineTo(s.x-8, s.y+8); ctx.lineTo(s.x+8, s.y+8);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.font = "bold 11px Arial"; ctx.shadowBlur = 4; ctx.shadowColor = "black";
                ctx.fillText(s.name, s.x - 15, s.y + 20); ctx.shadowBlur = 0;
            });
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath(); ctx.arc(epicentre.x, epicentre.y, 7, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
        }

        function start() { if(!active) { reset(false); active = true; animate(); } }

        function reset(move = false) {
            active = false; cancelAnimationFrame(raf); time = 0;
            if(move) {
                epicentre.x = 100 + Math.random() * (canvas.width - 200);
                epicentre.y = 100 + Math.random() * (canvas.height - 200);
            }
            stations.forEach((s, i) => {
                s.pT = 0; s.sT = 0;
                s.dist = Math.sqrt((s.x - epicentre.x)**2 + (s.y - epicentre.y)**2);
                const g = document.getElementById(`graph-${i}`);
                g.width = g.parentElement.offsetWidth;
                g.getContext('2d').clearRect(0,0,g.width,g.height);
                document.querySelectorAll('.arrival-label').forEach(el => el.remove());
                document.getElementById(`dt-${i}`).style.opacity = 0;
            });
            drawMap();
        }

        function animate() {
            if(!active) return;
            time += 1;
            drawMap();
            
            const vP = 3.5, vS = 1.9;

            ctx.lineWidth = 3;
            ctx.strokeStyle = `rgba(46, 204, 113, ${Math.max(0, 0.7 - time/400)})`;
            ctx.beginPath(); ctx.arc(epicentre.x, epicentre.y, time * vP, 0, Math.PI*2); ctx.stroke();
            ctx.strokeStyle = `rgba(231, 76, 60, ${Math.max(0, 0.7 - time/500)})`;
            ctx.beginPath(); ctx.arc(epicentre.x, epicentre.y, time * vS, 0, Math.PI*2); ctx.stroke();

            stations.forEach((s, i) => {
                const cvs = document.getElementById(`graph-${i}`), c = cvs.getContext('2d');
                const x = time * 1.0, mid = 60;
                if (x > cvs.width) return;

                let amp = 0.5, col = "#30363d";
                if(time * vP >= s.dist) {
                    if(!s.pT) { s.pT = time; label(i, 'P', x, 'var(--p-wave)'); }
                    amp = 18; col = "var(--p-wave)";
                }
                if(time * vS >= s.dist) {
                    if(!s.sT) { s.sT = time; label(i, 'S', x, 'var(--s-wave)'); }
                    amp = 40; col = "var(--s-wave)";
                    const dt = document.getElementById(`dt-${i}`);
                    dt.style.opacity = 1; dt.style.left = (s.pT * 1.0) + "px";
                    dt.style.width = ((s.sT - s.pT) * 1.0) + "px";
                    dt.innerText = `Δt: ${((s.sT - s.pT)/5).toFixed(1)}s`;
                }
                c.strokeStyle = col; c.beginPath(); c.moveTo(x-1, mid); c.lineTo(x, mid + (Math.random()-0.5)*amp); c.stroke();
            });
            raf = requestAnimationFrame(animate);
        }

        function label(idx, t, x, c) {
            const l = document.createElement('div');
            l.className = 'arrival-label'; l.innerText = t; l.style.left = x + "px"; l.style.color = c;
            l.style.border = `1px solid ${c}`;
            document.getElementById(`graph-${idx}`).parentElement.appendChild(l);
        }

        mapImg.onload = init;
        window.onload = init;
    </script>
</body>
</html>
